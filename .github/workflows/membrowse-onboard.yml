name: Onboard to MemBrowse

on:
  workflow_dispatch:
    inputs:
      num_commits:
        description: 'Number of commits to process'
        required: true
        default: '100'
        type: string

jobs:
  load-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Load target matrix
        id: set-matrix
        run: echo "matrix=$(jq -c '.' .github/membrowse-targets.json)" >> "$GITHUB_OUTPUT"

  onboard:
    needs: load-targets
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-targets.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # LLVM matches the current llvm-version.txt, so commits from before an
      # LLVM upgrade fail to build.
      - uses: ./.github/actions/setup-llvm
        with:
          save-cache: "false"
      # Onboard runs git clean -fdx before each commit, so keep LLVM outside
      # the checkout and link it back in.
      - name: Move LLVM out of the checkout
        run: mv llvm-build llvm-project "$RUNNER_TEMP/"
      - name: Run MemBrowse Onboard Action
        uses: membrowse/membrowse-action/onboard-action@v1
        with:
          target_name: ${{ matrix.target_name }}
          num_commits: ${{ github.event.inputs.num_commits }}
          build_script: ln -sfn "$RUNNER_TEMP/llvm-build" llvm-build && ln -sfn "$RUNNER_TEMP/llvm-project" llvm-project && ${{ matrix.build_cmd }}
          elf: ${{ matrix.elf }}
          ld: ${{ matrix.ld }}
          map_file: ${{ matrix.map_file }}
          linker_vars: ${{ matrix.linker_vars }}
          binary_search: 'true'
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}
          api_url: ${{ vars.MEMBROWSE_API_URL }}
